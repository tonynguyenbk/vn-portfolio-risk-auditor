[project]
name = "vn-risk-auditor-backend"
version = "0.1.0"
description = "Risk measurement, model validation and stress-testing engine for the VN Portfolio Risk Auditor"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "numpy>=2.1",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "httpx>=0.28",
    # SciPy is a TEST-ONLY dependency and must never be imported by app code.
    # The engine computes the chi-squared(1) survival function with math.erfc
    # and normal quantiles with statistics.NormalDist; SciPy exists here purely
    # as an independent oracle those implementations are checked against.
    # Keeping it out of the runtime also keeps the deployed bundle inside the
    # size limit of a free serverless tier.
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",
    "NPY",  # numpy-specific rules
]

[tool.ruff.lint.flake8-bugbear]
# `File(...)`, `Form(...)` and `Depends(...)` in argument defaults is the
# documented FastAPI idiom, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test file.
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Lets tests import `app`, `scripts` and `tests.conftest` from the backend root.
pythonpath = ["."]
